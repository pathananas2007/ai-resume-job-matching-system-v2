<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Backend Connection Test</title>    <style>        body {            font-family: Arial, sans-serif;            max-width: 800px;            margin: 50px auto;            padding: 20px;        }        button {            background: #4CAF50;            color: white;            padding: 10px 20px;            border: none;            border-radius: 4px;            cursor: pointer;            font-size: 16px;            margin: 5px;        }        button:hover {            background: #45a049;        }        #result {            margin-top: 20px;            padding: 15px;            border-radius: 4px;            white-space: pre-wrap;            font-family: monospace;        }        .success {            background: #d4edda;            border: 1px solid #c3e6cb;            color: #155724;        }        .error {            background: #f8d7da;            border: 1px solid #f5c6cb;            color: #721c24;        }        .info {            background: #d1ecf1;            border: 1px solid #bee5eb;            color: #0c5460;        }    </style></head><body>    <h1>≡ƒöì Backend Connection Test</h1>    <p>This page tests if your browser can connect to the FastAPI backend.</p>        <div>        <button onclick="testHealth()">1. Test Health Endpoint</button>        <button onclick="testAnalyze()">2. Test Analyze Endpoint</button>        <button onclick="testCORS()">3. Test CORS</button>    </div>        <div id="result"></div>    <script>        const BACKEND_URL = 'http://localhost:8000';                function showResult(message, type = 'info') {            const result = document.getElementById('result');            result.textContent = message;            result.className = type;        }        async function testHealth() {            showResult('Testing health endpoint...', 'info');                        try {                const response = await fetch(`${BACKEND_URL}/health`);                const data = await response.json();                                showResult(                    'Γ£à SUCCESS!\n\n' +                    'Backend is running and accessible.\n\n' +                    'Response:\n' + JSON.stringify(data, null, 2),                    'success'                );            } catch (error) {                showResult(                    'Γ¥î FAILED!\n\n' +                    'Error: ' + error.message + '\n\n' +                    'Possible causes:\n' +                    '1. Backend is not running\n' +                    '2. Backend is running on a different port\n' +                    '3. CORS is blocking the request\n' +                    '4. Firewall is blocking port 8000\n\n' +                    'Solution:\n' +                    '1. Start backend: cd backend && python main.py\n' +                    '2. Check backend terminal for errors\n' +                    '3. Verify backend is on port 8000',                    'error'                );            }        }        async function testAnalyze() {            showResult('Testing analyze endpoint...', 'info');                        try {                const response = await fetch(`${BACKEND_URL}/api/seeker/analyze`, {                    method: 'POST',                    headers: {                        'Content-Type': 'application/json',                    },                    body: JSON.stringify({                        resume_text: 'Experienced Software Engineer with 5+ years in Python, React, and FastAPI. Built scalable web applications and RESTful APIs. Strong problem-solving skills.',                        job_description: 'We are looking for a Senior Full-Stack Developer with strong Python and React experience to join our team. Must have experience with FastAPI and building scalable applications.'                    })                });                                if (!response.ok) {                    const errorData = await response.json();                    throw new Error(JSON.stringify(errorData, null, 2));                }                                const data = await response.json();                                showResult(                    'Γ£à SUCCESS!\n\n' +                    'Analyze endpoint is working!\n\n' +                    'Score: ' + data.score + '/100\n' +                    'Recommendation: ' + data.recommendation + '\n' +                    'Status: ' + data.statusLabel + '\n\n' +                    'Full response:\n' + JSON.stringify(data, null, 2).substring(0, 500) + '...',                    'success'                );            } catch (error) {                showResult(                    'Γ¥î FAILED!\n\n' +                    'Error: ' + error.message + '\n\n' +                    'Possible causes:\n' +                    '1. Backend is not running\n' +                    '2. Gemini API key is invalid/expired\n' +                    '3. CORS is blocking the request\n' +                    '4. Backend route is not registered\n\n' +                    'Solution:\n' +                    '1. Check backend terminal for errors\n' +                    '2. Verify Gemini API key in backend/.env\n' +                    '3. Check backend logs for details',                    'error'                );            }        }        async function testCORS() {            showResult('Testing CORS configuration...', 'info');                        try {                const response = await fetch(`${BACKEND_URL}/health`, {                    method: 'GET',                    headers: {                        'Origin': window.location.origin                    }                });                                const corsHeaders = {                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers'),                };                                showResult(                    'Γ£à CORS Test Complete!\n\n' +                    'Your origin: ' + window.location.origin + '\n' +                    'Backend URL: ' + BACKEND_URL + '\n\n' +                    'CORS Headers:\n' + JSON.stringify(corsHeaders, null, 2) + '\n\n' +                    'If Access-Control-Allow-Origin is null or doesn\'t match your origin,\n' +                    'you need to add your origin to backend/.env ALLOWED_ORIGINS',                    'success'                );            } catch (error) {                showResult(                    'Γ¥î CORS Test Failed!\n\n' +                    'Error: ' + error.message + '\n\n' +                    'This usually means CORS is blocking the request.\n\n' +                    'Solution:\n' +                    '1. Add your origin to backend/.env:\n' +                    '   ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,' + window.location.origin + '\n' +                    '2. Restart backend server\n' +                    '3. Try again',                    'error'                );            }        }        // Auto-run health test on page load        window.addEventListener('load', () => {            setTimeout(testHealth, 500);        });    </script></body></html>
